<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        
        <div class="mode-selection">
            <button id="btn-pvp" class="active">2 Player</button>
            <button id="btn-pva">vs AI</button>
        </div>

        <div class="score-board">
            <div class="score-box x-score">
                <span class="player-label">Player X</span>
                <span id="score-x">0</span>
            </div>
            <div class="score-box o-score">
                <span class="player-label" id="label-o">Player O</span>
                <span id="score-o">0</span>
            </div>
        </div>

        <div class="status" id="status">Player X's Turn</div>

        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <button id="restart" class="restart-btn">Restart Game</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
